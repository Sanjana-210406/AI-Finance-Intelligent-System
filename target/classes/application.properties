spring.application.name=aifinance

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/aifinance_db
spring.datasource.username=root
spring.datasource.password=jave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081

# JWT Secret Key (used later for auth)
jwt.secret=aifinance_super_secret_key_2024_javeriya
jwt.expiration=86400000

# Disable Spring Security default login page for now (we'll configure it properly later)

spring.security.user.name=admin
spring.security.user.password=admin

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Temp upload folder
app.upload.dir=uploads





